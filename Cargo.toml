[package]
name = "trix-connect"
version = "0.1.0"
edition = "2021"
description = "Neutral coupling layer for the -trix application family: discovery, invoice contract, and bookkeeping/VAT-rate traits."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
async-trait = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
